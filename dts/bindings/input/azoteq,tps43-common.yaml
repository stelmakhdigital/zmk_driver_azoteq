properties:
  rdy-gpios:
    type: phandle-array
    required: false
    description: GPIO пин для сигнала прерывания RDY (Ready)

  rst-gpios:
    type: phandle-array
    required: false
    description: GPIO пин для сигнала сброса RST (Reset)

  filter-settings:
    type: int
    default: 0x0B
    description: |
      Регистр Filter Settings (0x0632):
      - Бит 0 (0x01): IIR-фильтр координат (сглаживание, убирает дрожание).
      - Бит 1 (0x02): MAV-фильтр (скользящее среднее, убирает выбросы).
      - Бит 2 (0x04): IIR Select. 0 = динамический IIR (адаптируется к скорости, рекомендуется),
        1 = фиксированный IIR (сильнее сглаживает медленное движение, но добавляет задержку).
      - Бит 3 (0x08): ALP count filter (фильтр канала low-power/пробуждения).

      Типовые значения:
      - 0x0B (по умолчанию, как в прошивке Azoteq): IIR + MAV + ALP, динамический IIR.
      - 0x0F: всё + фиксированный IIR — максимум сглаживания, больше «вязкости».
      - 0x03: IIR + MAV.
      - 0x01: только IIR — МАЛО фильтрации, курсор дрожит и «рвётся».

  sensitivity:
    type: int
    default: 100
    description: Множитель движения курсора, % (100 = 1:1). Дробная часть не теряется.

  scroll-sensitivity:
    type: int
    default: 50
    description: Множитель прокрутки, % (дробная часть накапливается между кадрами).

  movement-start-threshold:
    type: int
    default: 0
    description: |
      Сколько единиц (|dx|+|dy|) палец должен пройти после касания, прежде чем курсор
      начнёт двигаться. Убирает сдвиг курсора при тапе и дрожание лежащего пальца.
      0 = выключено. Рекомендуется 3–8.

  typing-tap-timeout-ms:
    type: int
    default: 0
    description: |
      Игнорировать тапы (ЛКМ/ПКМ/удержание) в течение N мс после нажатия клавиши
      на этой же половине. 0 = выключено. Рекомендуется 300–600.

  typing-move-timeout-ms:
    type: int
    default: 0
    description: Игнорировать движение курсора N мс после нажатия клавиши. 0 = выключено.

  swipe-threshold:
    type: int
    default: 100
    description: Путь по X (единиц) для срабатывания свайпа тремя пальцами (Назад/Вперёд).

  palm-reject:
    type: boolean
    description: Включить аппаратную режекцию ладони (XY Config 0, бит 3).

  palm-reject-threshold:
    type: int
    default: 0
    description: Порог режекции ладони (регистр 0x066C). 0 = не менять.

  disable-reati:
    type: boolean
    description: |
      Не включать автоматическую повторную калибровку (Re-ATI). По умолчанию драйвер её
      ВКЛЮЧАЕТ — без неё базовая линия «уплывает» и появляются фантомные касания.

  active-report-rate-ms:
    type: int
    default: 0
    description: Период опроса в активном режиме, мс (0x057A). 0 = не менять. Типично 8–10.

  idle-touch-report-rate-ms:
    type: int
    default: 0
    description: |
      Период опроса в режиме Idle-Touch (палец лежит неподвижно), мс (0x057C).
      Если больше active — первое движение после паузы «дёргается». 0 = не менять.

  active-timeout-s:
    type: int
    default: 0
    description: Через сколько секунд без движения перейти из Active в Idle-Touch (0x0584). 0 = не менять.

  tap-time-ms:
    type: int
    default: 0
    description: Максимальная длительность тапа, мс (0x06B9). Меньше = меньше ложных кликов. 0 = не менять.

  tap-distance:
    type: int
    default: 0
    description: Максимальное смещение пальца при тапе (0x06BB). 0 = не менять.

  hold-time-ms:
    type: int
    default: 0
    description: Время до срабатывания press-and-hold, мс (0x06BD). 0 = не менять.

  scroll-initial-distance:
    type: int
    default: 0
    description: Начальное расстояние для старта скролла (0x06C8). 0 = не менять.

  register-writes:
    type: array
    description: |
      Произвольные 8-битные записи в регистры перед SETUP_COMPLETE, парами <адрес значение>.
      Пример: register-writes = <0x066B 0x01>;  Использовать с даташитом.

  enable-power-management:
    type: boolean
    description: Усыплять тачпад, когда ZMK уходит в idle/sleep.

  single-tap:
    type: boolean
    description: Включить жест одиночного касания (ЛКМ)

  two-finger-tap:
    type: boolean
    description: Включить касание двумя пальцами (ПКМ)

  scroll:
    type: boolean
    description: Включить прокрутку двумя пальцами

  swipes:
    type: boolean
    description: Свайпы тремя пальцами по X → кнопки «Назад»/«Вперёд» (MB4/MB5)

  switch-xy:
    type: boolean
    description: Поменять местами оси X и Y

  press-and-hold:
    type: boolean
    description: Включить жест нажатия и удержания (перетаскивание)

  invert-x:
    type: boolean
    description: Инвертировать X

  invert-y:
    type: boolean
    description: Инвертировать Y

  invert-scroll-x:
    type: boolean
    description: Инвертировать горизонтальный скролл

  invert-scroll-y:
    type: boolean
    description: Инвертировать вертикальный скролл
